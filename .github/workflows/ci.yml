name: CI
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: 17
        distribution: temurin
    - uses: sbt/setup-sbt@v1
    - uses: coursier/cache-action@v9
    # TODO run `migrate domain/checkGeneratedCode`
    - run: sbt scalafmtCheckAll scalafmtSbtCheck compile test
